name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon > ../gradle_build.log 2>&1 || true

      - name: Check Build Result and Handle Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ls android/app/build/outputs/apk/debug/*.apk 1> /dev/null 2>&1; then
            echo "=== APK BUILT SUCCESSFULLY! ==="
            cp android/app/build/outputs/apk/debug/*.apk ./OpsMaster-Debug.apk
            git checkout -B apk-dist
            git add OpsMaster-Debug.apk
            git commit -m "chore: automated build apk [skip ci]" || true
            git push -f origin apk-dist
          else
            echo "=== GRADLE BUILD FAILED! LAST 100 LINES OF LOG: ==="
            tail -n 100 gradle_build.log
            git checkout -B build-log
            git add gradle_build.log
            git commit -m "ci: save build log [skip ci]" || true
            git push -f origin build-log || true
            exit 1
          fi

      - name: Upload APK as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpsMaster-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
