name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        id: gradle_build
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon > ../gradle_build.log 2>&1 || touch ../BUILD_FAILED

      - name: Output Log to Summary
        if: always()
        run: |
          echo "## Build Diagnostics Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f BUILD_FAILED ]; then
            echo "### :x: Gradle Build Failed. Last 100 lines:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### :white_check_mark: Gradle Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Build-Log
          path: gradle_build.log
          retention-days: 7

      - name: Upload APK as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpsMaster-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Check Build Exit
        run: |
          if [ -f BUILD_FAILED ]; then
            echo "Build failed! See summary and Gradle-Build-Log artifact."
            exit 1
          fi
